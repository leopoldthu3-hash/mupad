name: Build unsigned MuPad IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and bundle local Python runtime
        run: |
          npm ci
          npm run bundle
          npx cap add ios
          npx cap sync ios
      - name: Build an unsigned iPhone/iPad app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA for FlekSt0re signing
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/App.app
          ditto -c -k --sequesterRsrc --keepParent Payload MuPad-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MuPad-unsigned-ipa
          path: MuPad-unsigned.ipa
          if-no-files-found: error
